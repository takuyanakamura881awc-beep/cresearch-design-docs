# ============================================================
# 銘柄選定パラメータ  (docs/03-universe.md)
#
# 2層構造:
#   Layer 1 = ユニバース構築 (日次バッチ・ハードフィルタ) → 100〜200銘柄
#   Layer 2 = 日次スコアリング (寄り前・WebSocket 50枠)   → 50銘柄
#
# 【重要】ここのパラメータは「資金量の関数」。
# 資金が増えたら price_range の上限と max_positions を緩められる。
# ============================================================

capital:
  # 運用資金（円）。price_range と position_sizing の前提になる。
  total: 500000

# ------------------------------------------------------------
# Layer 1: ユニバース構築 (日次バッチ・すべてハードフィルタ)
# ------------------------------------------------------------
layer1:
  # A. 市場
  markets:
    - "プライム"

  # B. 流動性: 10〜15万円の注文が板を動かさない水準
  #
  # 【実測で10億円から引き下げた（2026-08-23）】
  # 10億円では株価上限1,250円との組み合わせで55銘柄しか残らず、
  # 監視枠50の1.1倍で Layer 2 の選定が機能しなかった。
  # これは安全装置ではなく品質閾値。板インパクトは十分小さい:
  #   注文15万円 / 売買代金 3億円 = 0.050%
  #   注文10万円 / 売買代金 3億円 = 0.033%
  # 引き下げたぶんは約定モデル側で厳しくしてある
  # （broker/replay.py が売買代金5億円未満に +5bps を上乗せする）。
  liquidity:
    min_avg_turnover_yen: 300_000_000     # 20日平均売買代金 3億円以上
    lookback_days: 20

  # C. 株価レンジ: 単元100株なので 1単元 = 株価 × 100円
  #
  # 【境界は分布ではなく安全装置から導出する】
  #   通常枠の上限   = 資金 ÷ max_concurrent(5) ÷ 100株 = 1,000円
  #   プレミアム上限 = 資金 × 上限比率(25%)      ÷ 100株 = 1,250円
  #
  #   通常枠   300〜1,000円   → 1単元 3万〜10万円   … 5銘柄同時に持てる
  #   プレミアム枠 1,000〜1,250円 → 1単元 10万〜12.5万円 … 4銘柄に減る
  #
  # 当初の上限3,000円は資金50万円では実現できないと実測で確定した。
  # 25%上限（12.5万円）を守る限り1,250円超は1単元すら建てられず、
  # 選定を通してもサイジングで0株になる（該当が1,483中502銘柄あった）。
  # 資金が増えたとき真っ先に緩められるのがここ（300万円なら7,500円まで）。
  price_range:
    hard_min: 300      # 未満は除外。1ティック(1円)が0.33%以上でコスト過大
    normal_max: 1000   # ここまでが通常枠（5銘柄同時保有できる）
    premium_max: 1250  # 取引可能な最大株価。超過は1単元も建てられないので除外

  # D. 信用区分: ショートを使うため売建可能であることが必須
  #
  # 【実測で代理が不要になった】J-Quants の銘柄一覧に MrgnNm があり、
  # "貸借" なら制度信用で売建できると判定できる（2026-08-23 に確認）。
  # プライム1,565銘柄のうち1,483銘柄(95%)が貸借銘柄で、
  # 売建可否はボトルネックにならない。
  #
  # 一般信用(デイトレ)の在庫は証券会社側の情報なので Stage B で差し替える。
  margin:
    require_loanable: true             # MrgnNm == "貸借" のみ通す

  # E. 空売り価格規制がかかっている銘柄を除外
  exclude_short_sale_restricted: true

  # F〜I. 除外条件
  exclusions:
    earnings_buffer_days: 2      # 決算発表日の前後N営業日を除外
    min_days_since_listing: 60   # 上場後3ヶ月未満を除外（約60営業日）
    exclude_limit_hit: true      # ストップ高/安
    exclude_halted: true         # 売買停止
    exclude_supervised: true     # 監理・整理銘柄
    corporate_action_buffer_days: 3   # 分割・併合の前後N営業日を除外

  # 通過数【実測 2026-08-23 / 基準日 2026-05-29】
  #   全上場 4,451
  #     → プライム              1,565  (A: 2,886除外。ETFは市場「その他」でここに入る)
  #     → かつ貸借              1,483  (D:    82除外)
  #     → 株価 300〜1,250円・売買代金3億円以上 → 133  ← Layer 1 の出力
  #
  # 【株価上限ごとの通過数（上限比率25%固定・流動性3億円）】
  #     ≤   500円:  19    ≤ 1,000円:  85
  #     ≤   800円:  50    ≤ 1,250円: 133
  #
  # 【流動性下限ごとの通過数（株価1,250円以下）】
  #     10億円: 55(監視枠の1.1倍)   3億円: 133(2.7倍) ← 採用
  #      5億円: 88(1.8倍)           2億円: 158(3.2倍)
  #   100銘柄を超える最も厳しい水準が3億円。2億円まで下げても +25 で頭打ち。
  #
  # 判定は「見込みに近いか」ではなく目的から決める:
  #   下限100 = 監視枠50の2倍（日々の出入りで枠が埋まらなくなるのを避ける）
  #   上限500 = 出発点1,483の約1/3（超えると絞り込みが機能していない）
  # 詳細は docs/03-universe.md §1。
  acceptable_survivors: [100, 500]
  measured_survivors: 133

# ------------------------------------------------------------
# Layer 2: 日次銘柄選定 (寄り前 8:00-8:55)
# ------------------------------------------------------------
layer2:
  # 上限50は Stage B の WebSocket 配信制限に由来する。
  # Stage A(ヒストリカル検証)に技術的制約はないが、同じ50に揃える。
  # 銘柄数を変えると成績が変わり、Stage A の検証結果を Stage B に引き継げなくなる。
  max_watchlist: 50

  # ATR% には下限と上限の両方をかける。**根拠がまったく別。**
  #
  #   下限 = スプレッド円 × 5。これ未満はコスト負け（**円建て。%ではない**）
  #   上限 5.33% = 日次ブレーカー(2%) ÷ (1銘柄上限25% × 損切り1.5倍)
  #                これを超えると1敗で当日が全停止する
  #
  # **下限と上限で単位が違うのは間違いではない。**
  # 往復コストは「スプレッド円 ÷ ATR円」で決まり株価が式に出てこないので、
  # コスト側は円で判定する。かつては「ATR% 2%以上」としていたが、これは
  # 株価帯が300〜1,250円に固定という前提の上でだけ成り立つ近似だった。
  # 600円×ATR3.33% と 2,200円×ATR0.91% はどちらもATR20円で同じコストなのに、
  # 2%の下限は前者だけを通してしまう（src/autotrader/tick.py）。
  #
  # 上限が要るのは stage_a_weights が ATR% に最大の重み(0.40)を置いているため。
  # 下限だけだと、スコアリング自体が最も危険な銘柄を上位に押し上げる。
  # 実測(2026-05-29)ではATR%の最大が17.12%で、上位10のうち2つが1敗 -2% 超だった。
  #
  # 上限は risk/limits.py の max_atr_pct() が導出する。ここに直書きしない
  # （ブレーカーや上限比率を動かしたとき置き去りになる）。
  min_atr_cost_multiple: 5.0  # ATR円 >= スプレッド円 × 5
  spread_ticks: 2.0           # スプレッドを呼値の何本ぶんとみなすか（**未実測の仮定**）
  # max_atr_pct: 導出値。risk.limits.max_atr_pct() = 0.0533
  atr_period: 14

  # --- Stage A: 前日引け時点の情報のみ (口座なしで計算できる) ---
  # 寄り前気配は kabuステーションAPI が必要なため Stage A では使えない。
  stage_a_weights:
    atr_pct: 0.40             # 日中値幅の期待値
    prev_volume_ratio: 0.25   # 前日出来高 ÷ 20日平均
    prev_range_pct: 0.20      # (前日高値 - 前日安値) ÷ 前日終値
    prev_close_position: 0.15 # (終値 - 安値) ÷ (高値 - 安値)

  # --- Stage B: 寄り前気配を追加 (口座が必要) ---
  # 【重要】Stage B で指標を追加するとき、stage_a_weights をそのまま流用しない。
  #         指標が変われば最適な重みも変わる。ウォークフォワード検証をやり直すこと。
  #         そもそも寄り前気配が予測力を持つかを、あり/なしの比較で先に検証する。
  stage_b_enabled: false
  stage_b_weights:
    atr_pct: 0.30
    prev_volume_ratio: 0.15
    prev_range_pct: 0.15
    prev_close_position: 0.10
    gap_pct: 0.20                # 寄り前気配 vs 前日終値
    premarket_volume_ratio: 0.10 # 寄り前の板の厚み ÷ 20日平均出来高

  # プレミアム枠(1,000〜1,250円)の採用条件
  # 1単元が資金の20〜25%を占め、同時保有数が5銘柄から4銘柄に減る。
  # その集中リスク増を正当化するだけの期待リターン優位を要求する。
  premium_tier:
    enabled: true
    # 通常枠で採用された銘柄のスコア中央値に対する倍率のハードル
    # 【暫定値】Phase 3 で「プレミアム枠あり/なし」の成績を比較して検証・調整する。
    #          寄与しないことが分かったら enabled: false にする。
    score_multiplier: 1.3
    max_concurrent: 1      # 同時採用は1銘柄まで（集中リスクの上限）
