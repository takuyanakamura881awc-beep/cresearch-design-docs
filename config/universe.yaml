# ============================================================
# 銘柄選定パラメータ  (docs/03-universe.md)
#
# 2層構造:
#   Layer 1 = ユニバース構築 (日次バッチ・ハードフィルタ) → 100〜200銘柄
#   Layer 2 = 日次スコアリング (寄り前・WebSocket 50枠)   → 50銘柄
#
# 【重要】ここのパラメータは「資金量の関数」。
# 資金が増えたら price_range の上限と max_positions を緩められる。
# ============================================================

capital:
  # 運用資金（円）。price_range と position_sizing の前提になる。
  total: 500000

# ------------------------------------------------------------
# Layer 1: ユニバース構築 (日次バッチ・すべてハードフィルタ)
# ------------------------------------------------------------
layer1:
  # A. 市場
  markets:
    - "プライム"

  # B. 流動性: 10〜15万円の注文が板を動かさない水準
  liquidity:
    min_avg_turnover_yen: 1_000_000_000   # 20日平均売買代金 10億円以上
    lookback_days: 20

  # C. 株価レンジ: 単元100株なので 1単元 = 株価 × 100円
  #    通常枠   300〜2,000円  → 1単元 3万〜20万円
  #    プレミアム枠 2,000〜3,000円 → 1単元 20万〜30万円
  price_range:
    hard_min: 300      # 未満は除外。1ティック(1円)が0.33%以上でコスト過大
    normal_max: 2000   # ここまでが通常枠
    premium_max: 3000  # ここまでがプレミアム枠。超過は除外(資金の60%超で分散不能)

  # D. 信用区分: ショートを使うため売建可能であることが必須
  #
  # 【実測で代理が不要になった】J-Quants の銘柄一覧に MrgnNm があり、
  # "貸借" なら制度信用で売建できると判定できる（2026-08-23 に確認）。
  # プライム1,565銘柄のうち1,483銘柄(95%)が貸借銘柄で、
  # 売建可否はボトルネックにならない。
  #
  # 一般信用(デイトレ)の在庫は証券会社側の情報なので Stage B で差し替える。
  margin:
    require_loanable: true             # MrgnNm == "貸借" のみ通す

  # E. 空売り価格規制がかかっている銘柄を除外
  exclude_short_sale_restricted: true

  # F〜I. 除外条件
  exclusions:
    earnings_buffer_days: 2      # 決算発表日の前後N営業日を除外
    min_days_since_listing: 60   # 上場後3ヶ月未満を除外（約60営業日）
    exclude_limit_hit: true      # ストップ高/安
    exclude_halted: true         # 売買停止
    exclude_supervised: true     # 監理・整理銘柄
    corporate_action_buffer_days: 3   # 分割・併合の前後N営業日を除外

  # 通過数【実測 2026-08-23 / 基準日 2026-05-29】
  #   全上場 4,451
  #     → プライム              1,565  (A: 2,886除外。ETFは市場「その他」でここに入る)
  #     → かつ貸借              1,483  (D:    82除外)
  #     → ストップ高安を除く    1,476  (H:     7除外)
  #     → 株価 300〜3,000円       951  (C:   525除外。うち上限超が502)
  #     → 20日平均売買代金10億~   287  (B:   664除外)  ← Layer 1 の出力
  #
  # 設計時の見込みは 100〜200 だったが実測287。外れたのは見込みのほうなので
  # 閾値は変えない。判定は「見込みに近いか」ではなく目的から決める:
  #   下限100 = 監視枠50の2倍（日々の出入りで枠が埋まらなくなるのを避ける）
  #   上限500 = 出発点1,483の約1/3（超えると絞り込みが機能していない）
  # 詳細は docs/03-universe.md §1。
  acceptable_survivors: [100, 500]
  measured_survivors: 287

# ------------------------------------------------------------
# Layer 2: 日次銘柄選定 (寄り前 8:00-8:55)
# ------------------------------------------------------------
layer2:
  # 上限50は Stage B の WebSocket 配信制限に由来する。
  # Stage A(ヒストリカル検証)に技術的制約はないが、同じ50に揃える。
  # 銘柄数を変えると成績が変わり、Stage A の検証結果を Stage B に引き継げなくなる。
  max_watchlist: 50

  # ATR% が往復コスト(スリッページ)の5倍以上ないとコスト負けする
  min_atr_pct: 0.02        # 14日ATR ÷ 株価 が 2% 以上
  atr_period: 14

  # --- Stage A: 前日引け時点の情報のみ (口座なしで計算できる) ---
  # 寄り前気配は kabuステーションAPI が必要なため Stage A では使えない。
  stage_a_weights:
    atr_pct: 0.40             # 日中値幅の期待値
    prev_volume_ratio: 0.25   # 前日出来高 ÷ 20日平均
    prev_range_pct: 0.20      # (前日高値 - 前日安値) ÷ 前日終値
    prev_close_position: 0.15 # (終値 - 安値) ÷ (高値 - 安値)

  # --- Stage B: 寄り前気配を追加 (口座が必要) ---
  # 【重要】Stage B で指標を追加するとき、stage_a_weights をそのまま流用しない。
  #         指標が変われば最適な重みも変わる。ウォークフォワード検証をやり直すこと。
  #         そもそも寄り前気配が予測力を持つかを、あり/なしの比較で先に検証する。
  stage_b_enabled: false
  stage_b_weights:
    atr_pct: 0.30
    prev_volume_ratio: 0.15
    prev_range_pct: 0.15
    prev_close_position: 0.10
    gap_pct: 0.20                # 寄り前気配 vs 前日終値
    premarket_volume_ratio: 0.10 # 寄り前の板の厚み ÷ 20日平均出来高

  # プレミアム枠(2,000〜3,000円)の採用条件
  # 1単元が資金の40〜60%を占め、同時保有数が減り、リスク管理の粒度も粗くなる。
  # その集中リスク増を正当化するだけの期待リターン優位を要求する。
  premium_tier:
    enabled: true
    # 通常枠で採用された銘柄のスコア中央値に対する倍率のハードル
    # 【暫定値】Phase 3 で「プレミアム枠あり/なし」の成績を比較して検証・調整する。
    #          寄与しないことが分かったら enabled: false にする。
    score_multiplier: 1.3
    max_concurrent: 1      # 同時採用は1銘柄まで（集中リスクの上限）
