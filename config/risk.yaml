# ============================================================
# リスク管理・安全装置  (docs/05-risk-management.md)
#
# 【重要】ここの閾値を緩めるのは人間の判断。エージェントに委ねない。
#         成績が出ないときに基準を下げたくなるのが人間の常であり、
#         それを追認させると歯止めがなくなる。
# ============================================================

# ------------------------------------------------------------
# #1 レバレッジ1倍の不変条件（本システムの安全性の土台）
#     建玉総額(買建 + 売建) ≤ 現金残高
#     risk/leverage.py が全発注の必須通過点。バイパス経路を作らない。
# ------------------------------------------------------------
leverage:
  max_ratio: 1.0
  enforce: true        # false にしてはいけない

# ------------------------------------------------------------
# #2 大引け前 全建玉クローズ（最重要コードパス）
#     閉じ損ねると翌営業日に強制決済され1注文2,200円 = 目標リターンの約5日分
# ------------------------------------------------------------
close_all:
  # 【暫定値】大引け直前は板が薄くスリッページが増えるため、
  #          ペーパー期間の実測で調整する。
  scheduled_time: "14:50"
  max_retries: 5
  retry_interval_seconds: 10
  # クローズ後に GET /positions で残存を実測確認する（成功したと仮定しない）
  verify_after_close: true
  alert_on_residual: true

# ------------------------------------------------------------
# #3 空売りの逆指値ストップ（必須。上昇に上限がない＝損失も理論上無限）
# ------------------------------------------------------------
short_selling:
  require_stop_loss: true    # false にしてはいけない
  # ストップ発注に失敗したら建玉を即座に手仕舞う
  close_on_stop_order_failure: true

# ------------------------------------------------------------
# #4/#5/#6 損失ブレーカーの三層構造
#     日次は自動復帰、連続・累積は人の明示承認を要求する。
#     連続して負けているのは戦略が相場に合っていない可能性があり、
#     自動再開すると損失を垂れ流すため。
# ------------------------------------------------------------
breakers:
  daily_loss:
    threshold_pct: -0.02       # 総資産の -2%
    action: "halt_and_close"   # 当日全停止 + 全建玉クローズ
    auto_resume: true          # 翌営業日に自動復帰

  # 【#5 は2度作り直している。同じ形に戻さないため経緯を残す】
  #
  #   初版: 3営業日連続マイナス
  #     → **誤発動**。モンテカルロで、勝っている戦略（下落日率40%）でも
  #       60営業日で93%発動する。再開に人の承認が要るので
  #       「完全自動＋キルスイッチ」が成立しない
  #
  #   2版: 3連敗 かつ 累積 -5%
  #     → **見逃し**。実データで -0.46%/日 の消耗が続いたとき、
  #       3日連続では -1.37% にしかならず発動せず、
  #       累積DD の -15% まで誰も止めなかった
  #
  #   3版: 直近15営業日の累積 -5%（現行）
  #     → 連続性を要求しない。判定するのは「どれだけ削られたか」であって
  #       その並び方ではない。実測の消耗なら11日目で検出できる
  #
  # 三層が規模も期間も段階的になる:
  #     #4 日次      -2%   1営業日
  #     #5 移動窓    -5%   直近15営業日   ← -2%の2.5倍 / -15%の1/3
  #     #6 累積DD   -15%   ピークから（期間の制限なし）
  #
  # 窓15営業日（約3週間）の由来: 短いと通常の変動で発動し、
  # 長いと #6 に先を越されて意味がなくなる。
  rolling_loss:
    window_days: 15            # 直近15営業日
    threshold_pct: -0.05       # の累積が -5% 以下で発動
    action: "halt"
    auto_resume: false         # 人の明示承認が必要

  max_drawdown:
    threshold_pct: -0.15       # ピークから -15%
    action: "halt_and_close"
    auto_resume: false         # 人の明示承認が必要

# ------------------------------------------------------------
# #7 ポジション制限
# ------------------------------------------------------------
# 【25%という値の根拠 — 恣意的な数字ではない】
# 損切りは 1.5 × ATR（strategies.yaml）、Layer 2 の ATR% 下限は 2%。
# 1敗あたりの総資産インパクト = 上限比率 × ATR% × 1.5:
#
#     上限   ATR 2%   ATR 3%   ATR 4%
#     25%    -0.75%   -1.12%   -1.50%
#     40%    -1.20%   -1.80%   -2.40%  ← 1敗で日次ブレーカー(-2%)到達
#     60%    -1.80%   -2.70%   -3.60%  ← 同上
#
# **上限比率を緩めることは、実質的に日次ブレーカーの無効化に等しい。**
# 1日5〜15トレードする前提が「1敗で当日終了」に変わる。
#
# この25%が株価上限1,250円（= 50万 × 25% ÷ 100株）を決めており、
# max_concurrent の5が通常枠の上限1,000円（= 50万 ÷ 5 ÷ 100株）を決めている。
# ここを動かすとユニバースの株価レンジも連動して変わる。
positions:
  max_concurrent: 5                  # 最大同時保有銘柄数
  max_weight_per_symbol: 0.25        # 1銘柄あたり総資産の25%まで
  # 上限は 50万 × 25% = 12.5万円。ここを超える値を書くと #7 と矛盾する
  # （以前は150000で、25%上限を超えていた）。
  target_position_yen: [100000, 125000]   # 1銘柄あたりの目標建玉額

# ------------------------------------------------------------
# #8 レートリミッタ（API側の制限に当てず、こちらで待つ）
# ------------------------------------------------------------
rate_limits:
  order_per_second: 5        # 発注系
  info_per_second: 10        # 情報系・残高系

# ------------------------------------------------------------
# #9 発注冪等性（リトライでの二重発注を構造的に防ぐ）
# ------------------------------------------------------------
idempotency:
  enabled: true
  # 注文IDを発注前に永続化し、リトライ時はまず GET /orders で照会する
  state_file: "state/orders.db"
  max_order_retries: 3

# ------------------------------------------------------------
# #10 起動時 reconcile（状態のズレを抱えて動き続けない）
# ------------------------------------------------------------
reconcile:
  on_startup: true
  halt_on_mismatch: true     # 不一致なら発注停止 + 通知

# ------------------------------------------------------------
# #11 キルスイッチ
#     ファイルベースにする理由: プロセスが応答不能でも確実に操作できる。
#     ネットワークもAPIも介さない。
# ------------------------------------------------------------
killswitch:
  file_path: "KILL"
  check_interval_seconds: 5
  action: "halt_and_close"

# ------------------------------------------------------------
# #13 価格サニティ（誤データ・誤発注の防止）
# ------------------------------------------------------------
price_sanity:
  max_deviation_from_prev_close: 0.15   # 前日終値から±15%超なら発注拒否
  reject_zero_or_negative: true
  reject_empty_orderbook: true

# ------------------------------------------------------------
# #16 ハートビート（プロセスが死んだこと自体を検知する）
# ------------------------------------------------------------
heartbeat:
  interval_seconds: 30
  # 監視対象: プロセス死活・API疎通・kabuステーション常駐
  alert_after_missed: 3
