# ============================================================
# 取引手法のパラメータ  (docs/04-strategies.md)
#
# 【重要】数値はすべて暫定。Phase 4 のウォークフォワード検証で確定する。
#         in-sample で決めた成績は成績として数えない。
#
# 手法の位置づけ:
#   竹 = メイン。最初から作る
#   松 = 将来的に検討（竹が実弾で安定稼働した後）
#   梅 = 資金300万円以上で追加
# ============================================================

# 実行モード: backtest | paper | live
# live は実弾。docs/07-go-live-criteria.md の合格基準を満たすまで使わない。
mode: paper

# ------------------------------------------------------------
# 約定コストのモデル
#
# 【重要】デイトレ信用は手数料0・金利0・貸株料0だが、コストは0ではない。
#         スリッページとスプレッドを甘く見積もると本番で必ず乖離する。
# ------------------------------------------------------------
execution_cost:
  commission_rate: 0.0          # デイトレ信用は手数料0円
  interest_rate: 0.0            # 買方金利0%
  stock_lending_fee: 0.0        # 貸株料0%

  # ここが実質コスト。ペーパー期間の実測で必ず更新する。
  slippage_bps: 10              # 片道 0.10%（暫定・保守的に見積もる）
  spread_model: "orderbook"     # 板の実測スプレッドを使う
  # 成行は次ティックの反対サイド気配で約定するものとしてモデル化する

# ============================================================
# 竹 — デイトレード ロング/ショート（当日決済）★メイン手法
# ============================================================
take_intraday:
  enabled: true
  margin_type: "daytrade"       # デイトレ信用（手数料0・金利0・貸株料0）

  # --- シグナルA: オープニングレンジ・ブレイクアウト（順張り） ---
  opening_range_breakout:
    enabled: true
    range_start: "09:00"
    range_end: "09:30"          # 寄り付き後30分のレンジ
    breakout_buffer_bps: 5      # レンジ端からこの分だけ抜けたら発火
    allow_short: true

  # --- シグナルB: VWAP乖離の平均回帰（逆張り） ---
  vwap_reversion:
    enabled: true
    min_deviation_pct: 0.015    # VWAP から 1.5% 以上乖離
    # 乖離が拡大から縮小に転じたことを確認してからエントリー
    require_deviation_shrinking: true
    allow_short: true

  # 【重要】シグナルAとBは方向が逆になる場面がある。
  #         同一銘柄で両方が同時発火したらエントリーを見送る
  #         （矛盾するシグナルは情報がない状態と扱う）。
  skip_on_conflicting_signals: true

  # --- 手仕舞い規律 ---
  exits:
    stop_loss_atr_mult: 1.5     # ATR の何倍で損切り
    take_profit_atr_mult: 2.5   # ATR の何倍で利確
    atr_period: 14
    max_holding_minutes: 180    # 時間切れ
    # 14:50 の全建玉クローズは config/risk.yaml の close_all で制御する
    # （最重要コードパスなのでリスク側に置いている）

  # --- ポジション ---
  # 具体的な上限は config/risk.yaml の positions を参照（そちらが優先）
  entry:
    max_new_positions_per_day: 15
    # 同一銘柄の再エントリー（信用取引なので差金決済規制がなく可能）
    allow_same_symbol_reentry: true
    min_minutes_between_reentry: 15
    # 場が薄くなる時間帯は新規エントリーしない
    no_new_entry_after: "14:00"

# ============================================================
# 松 — スキャルピング（当日決済）／将来的に検討
#
# 着手条件: 竹が実弾で安定稼働した後。
# レイテンシ勝負で機関投資家に構造的に不利なため、
# 竹の実績とレイテンシ実測を見てから投資判断する。
# ============================================================
matsu_scalp:
  enabled: false
  margin_type: "daytrade"
  # 発注5req/秒の制限が回転数の物理的な上限を決める
  max_orders_per_second: 5
  # パラメータは着手時に定義する

# ============================================================
# 梅 — 日足スイング ロング/ショート／資金300万円以上で追加
#
# 梅は分散が効いてこそ機能する。50万円では株価レンジ制約と重なり
# モメンタム上位から選べる銘柄が激減して戦略の前提が崩れる。
# ============================================================
ume_swing:
  enabled: false
  required_capital: 3000000     # この資金に達するまで有効化しない
  margin_type: "general_long"   # 一般信用(長期)。金利・貸株料が発生する

  momentum:
    lookback_days: [60, 120]    # 過去N日リターンでランキング
    rebalance: "weekly"
    holding_days: [5, 20]
    n_long: 3
    n_short: 2

  # 【注意】竹と併用する場合も、レバレッジ1倍の不変条件は
  #         両手法の建玉合計に対して適用する。
