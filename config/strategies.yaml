# ============================================================
# 取引手法のパラメータ  (docs/04-strategies.md)
#
# 【重要】数値はすべて暫定。Phase 4 のウォークフォワード検証で確定する。
#         in-sample で決めた成績は成績として数えない。
#
# 手法の位置づけ:
#   竹 = メイン。最初から作る
#   松 = 将来的に検討（竹が実弾で安定稼働した後）
#   梅 = 資金300万円以上で追加
# ============================================================

# 実行モード
#   replay : Stage A のヒストリカル検証（口座・API不要）
#   paper  : Stage B のペーパートレード（口座・API必要。実弾ではない）
#   live   : 実弾。docs/07-go-live-criteria.md の合格基準を満たすまで使わない
mode: replay

# データ源（docs/09-data-sources.md）
data_source:
  # 【重要】日足は単一ソースではない。
  # J-Quants Free は12週(84日)遅延するため、5分足(直近60日)のある期間の日足が取れない。
  # 直近84日は yfinance で補完する。実装は data/base.py の FallbackDataSource。
  daily:
    primary: "jquants"    # JPX公式。分割調整が信頼できる（2年前〜84日前）
    fallback: "yahoo"     # 直近84日の穴を埋める。auto_adjust=True 必須
    # 重複期間(2年前〜84日前)で両者を突合し、乖離を実測する。
    # scripts/verify_data_sources.py が実行し、Light(1,650円/月)課金の判断材料にする。
    cross_check: true

  # 分足。J-Quants に分足は存在せず、フォールバック先がない単一障害点。
  intraday:
    primary: "yahoo"      # Stage B では "kabus" を追加する
    interval: "5m"
  # 5分足は過去60日分まとめて取れる。1分足は直近7日のみで日次ローリング回収が必要。
  # オープニングレンジ・ブレイクアウト(30分レンジ)の検証には5分足で十分。

  # yfinance のレート制限対策（docs/09 §2.5 落とし穴1）
  yahoo:
    batch_size: 20              # 1回のdownloadに渡す銘柄数
    batch_interval_seconds: 1.0 # バッチ間の待機
  jquants:
    requests_per_minute: 5      # Freeプラン。Light は 60

  cache:
    ttl_days: 1                 # 価格データのTTL。API障害時の緩衝材も兼ねる

# ------------------------------------------------------------
# 約定コストのモデル
#
# 【重要】デイトレ信用は手数料0・金利0・貸株料0だが、コストは0ではない。
#         スリッページとスプレッドを甘く見積もると本番で必ず乖離する。
#
# 【原則】検証できないものは必ず保守的な側(成績が悪くなる側)に倒す。
#         楽観的な約定モデルでバックテストに勝つのは簡単だが、目的ではない。
# ------------------------------------------------------------
execution_cost:
  commission_rate: 0.0          # デイトレ信用は手数料0円
  interest_rate: 0.0            # 買方金利0%
  stock_lending_fee: 0.0        # 貸株料0%

  # --- Stage A: 板情報がないため厚めに見積もる ---
  # 成行は「そのバーの不利な側」(買いは高値寄り/売りは安値寄り)で約定と仮定。
  # 指値はバーのレンジが価格を通過し、かつ出来高が十分な場合のみ約定と仮定。
  stage_a:
    slippage_bps: 20            # 片道 0.20%（板がないので保守的に）
    spread_model: "estimated"   # 終値からスプレッドを推定して合成

  # --- Stage B: 実測の板を使う ---
  # 成行は次ティックの反対サイド気配で約定するものとしてモデル化する。
  stage_b:
    slippage_bps: 10            # 片道 0.10%（暫定。ペーパー実測で必ず更新する）
    spread_model: "orderbook"   # 板の実測スプレッドを使う

  # Stage B で実測に置き換えたときに成績が崩れるなら、
  # それは Stage A のモデルが甘かったということ。

# ============================================================
# 竹 — デイトレード ロング/ショート（当日決済）★メイン手法
# ============================================================
take_intraday:
  enabled: true
  margin_type: "daytrade"       # デイトレ信用（手数料0・金利0・貸株料0）
  # Stage A では yfinance の5分足で検証する（過去60日分が即座に取れる）

  # --- シグナルA: オープニングレンジ・ブレイクアウト（順張り） ---
  opening_range_breakout:
    enabled: true
    range_start: "09:00"
    range_end: "09:30"          # 寄り付き後30分のレンジ
    breakout_buffer_bps: 5      # レンジ端からこの分だけ抜けたら発火
    allow_short: true

  # --- シグナルB: VWAP乖離の平均回帰（逆張り） ---
  vwap_reversion:
    enabled: true
    min_deviation_pct: 0.015    # VWAP から 1.5% 以上乖離
    # 乖離が拡大から縮小に転じたことを確認してからエントリー
    require_deviation_shrinking: true
    allow_short: true

  # 【重要】シグナルAとBは方向が逆になる場面がある。
  #         同一銘柄で両方が同時発火したらエントリーを見送る
  #         （矛盾するシグナルは情報がない状態と扱う）。
  skip_on_conflicting_signals: true

  # --- 板情報によるエントリー品質フィルタ（Stage B・docs/04「板情報の扱い」）---
  #
  # 【方針】板はシグナルの主役にはしない。竹の保有期間(数十分〜大引け)に対し、
  #         板の情報は数秒〜数分で陳腐化するため時間軸が合わない。
  #         板を主シグナルにするなら保有も数分にすべきで、それは松(スキャルピング)。
  #
  # ただし「エントリーの品質フィルタ」としてなら竹の時間軸でも効きうる。
  # Stage B で有効化し、足して成績が上がるかを実データで比較検証する。
  # 上がらなければ足さない（寄り前気配・プレミアム枠と同じ検証構造）。
  orderbook_filter:
    enabled: false              # Stage A では板が取れない。Stage B で true にして検証
    min_book_depth_ratio: 0.5   # 自注文サイズに対する最良気配の厚みの下限
    max_opposite_depth_ratio: 2.0  # 反対側の板が厚すぎたら見送る

  # --- 手仕舞い規律 ---
  exits:
    stop_loss_atr_mult: 1.5     # ATR の何倍で損切り
    take_profit_atr_mult: 2.5   # ATR の何倍で利確
    atr_period: 14
    max_holding_minutes: 180    # 時間切れ
    # 14:50 の全建玉クローズは config/risk.yaml の close_all で制御する
    # （最重要コードパスなのでリスク側に置いている）

  # --- ポジション ---
  # 具体的な上限は config/risk.yaml の positions を参照（そちらが優先）
  entry:
    max_new_positions_per_day: 15
    # 同一銘柄の再エントリー（信用取引なので差金決済規制がなく可能）
    allow_same_symbol_reentry: true
    min_minutes_between_reentry: 15
    # 場が薄くなる時間帯は新規エントリーしない
    no_new_entry_after: "14:00"

# ============================================================
# 松 — スキャルピング（当日決済）／将来的に検討
#
# 着手条件: 竹が実弾で安定稼働した後。
# レイテンシ勝負で機関投資家に構造的に不利なため、
# 竹の実績とレイテンシ実測を見てから投資判断する。
# ============================================================
matsu_scalp:
  enabled: false
  margin_type: "daytrade"
  # 発注5req/秒の制限が回転数の物理的な上限を決める
  max_orders_per_second: 5
  # パラメータは着手時に定義する

# ============================================================
# 梅 — 日足スイング ロング/ショート／資金300万円以上で追加
#
# 梅は分散が効いてこそ機能する。50万円では株価レンジ制約と重なり
# モメンタム上位から選べる銘柄が激減して戦略の前提が崩れる。
# ============================================================
ume_swing:
  enabled: false
  required_capital: 3000000     # この資金に達するまで有効化しない
  margin_type: "general_long"   # 一般信用(長期)。金利・貸株料が発生する

  momentum:
    lookback_days: [60, 120]    # 過去N日リターンでランキング
    rebalance: "weekly"
    holding_days: [5, 20]
    n_long: 3
    n_short: 2

  # 【注意】竹と併用する場合も、レバレッジ1倍の不変条件は
  #         両手法の建玉合計に対して適用する。
