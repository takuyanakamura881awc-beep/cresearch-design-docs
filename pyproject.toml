[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader"
version = "0.1.0"
description = "日本株の自動売買ツール (kabuステーションAPI / レバレッジ1倍固定の信用取引)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",          # kabuステーションAPI / J-Quants の REST クライアント
    "websockets>=12.0",     # kabuステーションAPI のリアルタイム配信
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",        # 分足の Parquet 永続化
    "pydantic>=2.6",        # 設定とAPIレスポンスのバリデーション
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",    # Stage A の分足入手経路（口座不要）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# テスト名は日本語で書く（意図が読み取りやすいため）。
# N802 の lowercase 規則は CJK 識別子に対して意味を持たない。
"tests/*" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
