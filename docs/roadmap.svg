<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1560" viewBox="0 0 1200 1560" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP','Meiryo',sans-serif">
  <rect width="1200" height="1560" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0f172a">日本株 自動売買ツール — ロードマップ</text>
  <text x="40" y="84" font-size="16" fill="#475569">資金50万円 / 信用取引をレバレッジ1倍で運用 / 主軸は「竹」＝デイトレード（当日決済）</text>
  <line x1="40" y1="100" x2="1160" y2="100" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== STAGE A ===== -->
  <rect x="40" y="120" width="1120" height="436" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
  <rect x="40" y="120" width="1120" height="46" rx="10" fill="#0f766e"/>
  <rect x="40" y="150" width="1120" height="16" fill="#0f766e"/>
  <text x="64" y="151" font-size="19" font-weight="700" fill="#ffffff">Stage A — 証券口座もAPIも不要</text>
  <text x="1136" y="151" font-size="15" fill="#a7f3d0" text-anchor="end">データ源: J-Quants 無料 + yfinance</text>

  <!-- Phase 0 -->
  <rect x="66" y="182" width="1068" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="104" cy="224" r="19" fill="#0f766e"/><text x="104" y="231" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">0</text>
  <text x="140" y="215" font-size="18" font-weight="700" fill="#0f172a">設計</text>
  <text x="140" y="241" font-size="14.5" fill="#475569">手法の松竹梅・安全装置16項目・合格基準・開発ハーネスを確定</text>
  <rect x="1010" y="210" width="106" height="28" rx="14" fill="#dcfce7"/><text x="1063" y="229" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">✓ 完了</text>

  <!-- Phase 1 -->
  <rect x="66" y="274" width="1068" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="104" cy="316" r="19" fill="#0f766e"/><text x="104" y="323" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="140" y="307" font-size="18" font-weight="700" fill="#0f172a">データ基盤</text>
  <text x="140" y="333" font-size="14.5" fill="#475569">日足・分足の取得と蓄積。実測でデータ品質を確認（乖離0.0000%）</text>
  <rect x="1010" y="302" width="106" height="28" rx="14" fill="#dcfce7"/><text x="1063" y="321" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">✓ 完了</text>

  <!-- Phase 2 -->
  <rect x="66" y="366" width="1068" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="104" cy="408" r="19" fill="#2563eb"/><text x="104" y="415" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="140" y="399" font-size="18" font-weight="700" fill="#0f172a">ユニバース構築 + バックテストエンジン</text>
  <text x="140" y="425" font-size="14.5" fill="#475569">1,483銘柄を流動性・株価帯で絞る／未来を見られない仕組みを内蔵</text>
  <rect x="994" y="394" width="122" height="28" rx="14" fill="#dbeafe"/><text x="1055" y="413" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">▶ 今ここ</text>

  <!-- Phase 3 -->
  <rect x="66" y="458" width="1068" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="104" cy="500" r="19" fill="#94a3b8"/><text x="104" y="507" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="140" y="491" font-size="18" font-weight="700" fill="#0f172a">竹の実装 + ヒストリカル検証</text>
  <text x="140" y="517" font-size="14.5" fill="#475569">寄り付きレンジ抜け／VWAP回帰を過去データで検証。過学習も検査</text>
  <rect x="1010" y="486" width="106" height="28" rx="14" fill="#f1f5f9"/><text x="1063" y="505" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">未着手</text>

  <!-- GATE 1 -->
  <path d="M600 560 L610 578 L590 578 Z" fill="#1e293b"/>
  <rect x="40" y="580" width="1120" height="76" rx="10" fill="#1e293b"/>
  <text x="64" y="612" font-size="18" font-weight="700" fill="#fbbf24">判定① — 口座を開く価値があるか</text>
  <text x="64" y="638" font-size="14.5" fill="#cbd5e1">シャープ &gt; 1.0 / 最大DD &lt; 20% / 100トレード超 / バイアス混入なし　→　見込みがなければ口座を開かずに戦略を練り直す</text>

  <!-- ===== STAGE B ===== -->
  <path d="M600 660 L610 678 L590 678 Z" fill="#b45309"/>
  <rect x="40" y="680" width="1120" height="252" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <rect x="40" y="680" width="1120" height="46" rx="10" fill="#b45309"/>
  <rect x="40" y="710" width="1120" height="16" fill="#b45309"/>
  <text x="64" y="711" font-size="19" font-weight="700" fill="#ffffff">Stage B — 口座あり／ただし運用資金は入れない</text>
  <text x="1136" y="711" font-size="15" fill="#fed7aa" text-anchor="end">kabuステーションAPI（Windows常駐）</text>

  <!-- Phase 4 -->
  <rect x="66" y="742" width="1068" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="104" cy="784" r="19" fill="#94a3b8"/><text x="104" y="791" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="140" y="775" font-size="18" font-weight="700" fill="#0f172a">発注API + 安全装置16項目</text>
  <text x="140" y="801" font-size="14.5" fill="#475569">レバ1倍の強制・大引け全決済・二重発注防止・キルスイッチ</text>
  <rect x="1010" y="770" width="106" height="28" rx="14" fill="#f1f5f9"/><text x="1063" y="789" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">未着手</text>

  <!-- Phase 5 -->
  <rect x="66" y="834" width="1068" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="104" cy="876" r="19" fill="#94a3b8"/><text x="104" y="883" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="140" y="867" font-size="18" font-weight="700" fill="#0f172a">3ヶ月ペーパートレード</text>
  <text x="140" y="893" font-size="14.5" fill="#475569">架空資金で実際の値動きに連動。戦略とシステムの両方を検証する</text>
  <rect x="1010" y="862" width="106" height="28" rx="14" fill="#f1f5f9"/><text x="1063" y="881" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">未着手</text>

  <!-- GATE 2 -->
  <path d="M600 936 L610 954 L590 954 Z" fill="#1e293b"/>
  <rect x="40" y="956" width="1120" height="96" rx="10" fill="#1e293b"/>
  <text x="64" y="988" font-size="18" font-weight="700" fill="#fbbf24">判定② — 実弾に移行してよいか（事前に定義。後から緩めない）</text>
  <text x="64" y="1013" font-size="14.5" fill="#cbd5e1">シャープ &gt; 1.0 ／ 最大DD &lt; 15% ／ 100トレード超 ／ バックテストとの乖離が許容内</text>
  <text x="64" y="1037" font-size="14.5" font-weight="700" fill="#fca5a5">システム障害ゼロ — 二重発注・建玉の当日決済漏れが1件でもあれば不合格</text>

  <!-- ===== 実弾 ===== -->
  <path d="M600 1056 L610 1074 L590 1074 Z" fill="#b91c1c"/>
  <rect x="40" y="1076" width="1120" height="160" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <rect x="40" y="1076" width="1120" height="46" rx="10" fill="#b91c1c"/>
  <rect x="40" y="1106" width="1120" height="16" fill="#b91c1c"/>
  <text x="64" y="1107" font-size="19" font-weight="700" fill="#ffffff">実弾運用 — 少額から段階的に</text>

  <rect x="66" y="1138" width="1068" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="104" cy="1178" r="19" fill="#94a3b8"/><text x="104" y="1185" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="140" y="1170" font-size="18" font-weight="700" fill="#0f172a">10万円 → 25万円 → 50万円</text>
  <text x="140" y="1195" font-size="14.5" fill="#475569">各段階1ヶ月。障害が1件でも出たらペーパーに戻す</text>
  <rect x="1010" y="1164" width="106" height="28" rx="14" fill="#f1f5f9"/><text x="1063" y="1183" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">未着手</text>

  <!-- ===== 将来 ===== -->
  <rect x="40" y="1258" width="546" height="128" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="64" y="1288" font-size="16" font-weight="700" fill="#334155">将来① 松 — スキャルピング</text>
  <text x="64" y="1314" font-size="14" fill="#64748b">数秒〜数分。板情報を使う</text>
  <text x="64" y="1338" font-size="14" fill="#64748b">着手条件: 竹が実弾で安定稼働した後</text>
  <text x="64" y="1364" font-size="13.5" fill="#94a3b8">レイテンシで機関投資家に不利。優先度は最低</text>

  <rect x="614" y="1258" width="546" height="128" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="638" y="1288" font-size="16" font-weight="700" fill="#334155">将来② 梅 — 日足スイング</text>
  <text x="638" y="1314" font-size="14" fill="#64748b">数日〜数週間。安全に稼ぐ手法として追加</text>
  <text x="638" y="1338" font-size="14" fill="#64748b">着手条件: 資金300万円以上</text>
  <text x="638" y="1364" font-size="13.5" fill="#94a3b8">分散が効いて初めて機能する。竹と時間軸が違い併用可</text>

  <!-- ===== 最終形 ===== -->
  <rect x="40" y="1410" width="1120" height="118" rx="10" fill="#0f172a"/>
  <text x="64" y="1444" font-size="18" font-weight="700" fill="#7dd3fc">最終的にどうなるか</text>
  <text x="64" y="1472" font-size="15" fill="#e2e8f0">平日9:00に自動起動し、当日の監視50銘柄を選び、シグナルで3〜5銘柄を売買。14:50に全建玉を必ず閉じる。</text>
  <text x="64" y="1497" font-size="15" fill="#e2e8f0">建玉総額は常に現金50万円以内（レバ1倍）。人の作業は日次レポートの確認5分と、ブレーカー発動時の再開判断のみ。</text>
  <text x="64" y="1519" font-size="13.5" fill="#94a3b8">目標 月利5%（ストレッチ10%）。ただし採否はリターンではなくシャープレシオで判断する。</text>
</svg>
